name: Sift PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  sift-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sift Engine
        uses: actions/checkout@v4
        with:
          repository: sahilsaleem2907/sift
          ref: master
          path: sift-src

      - name: Build Sift Container
        run: |
          cd sift-src
          docker build --target slim -t sift:local .

      - name: Run Sift Service
        env:
          DATABASE_URL: ${{ secrets.SIFT_DATABASE_URL }}
          LLM_MODEL: "openai/gpt-5.6-luna"
          LLM_API_KEY: ${{ secrets.SIFT_LLM_API_KEY }}  # ✅ FIXED: Sift reads LLM_API_KEY
        run: |
          docker run -d --name sift-service -p 8000:8000 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e LLM_MODEL="$LLM_MODEL" \
            -e LLM_API_KEY="$LLM_API_KEY" \
            -e OPENAI_API_KEY="$LLM_API_KEY" \
            -e SIFT_GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            sift:local

      - name: Wait for Sift Health Check
        run: |
          echo "Waiting for Sift service to start..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Sift is healthy and running!"
              exit 0
            fi
            echo "Waiting... (Status: $STATUS, Try: $i/30)"
            sleep 2
          done
          echo "❌ Sift service failed to start. Container logs:"
          docker logs sift-service
          exit 1

      - name: Trigger PR Review
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:8000/review \
            -H "Content-Type: application/json" \
            -d '{
              "owner": "${{ github.repository_owner }}",
              "repo": "${{ github.event.repository.name }}",
              "pr_number": ${{ github.event.pull_request.number }},
              "before_sha": "${{ github.event.before }}",
              "github_token": "${{ secrets.GITHUB_TOKEN }}"
            }')
          echo "Server Response: $RESPONSE"
          sleep 45
          docker logs sift-service

      - name: Show Logs on Failure
        if: failure()
        run: docker logs sift-service