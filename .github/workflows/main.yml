name: Code Reviewer

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Run Sift Review
        uses: sahilsaleem2907/sift/.github/workflows/sift-review.yml@master
        with:
          repository: ${{ github.repository }}
          pr_number: ${{ github.event.pull_request.number }}
          before_sha: ${{ github.event.before }}
        secrets:
          SIFT_IMAGE: "ghcr.io/sahilsaleem2907/sift:latest"
          SIFT_DATABASE_URL: ${{ secrets.SIFT_DATABASE_URL }}
          SIFT_LLM_MODEL: "openai/gpt-4o" # or "gemini/gemini-2.0-flash"
          SIFT_LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SIFT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
